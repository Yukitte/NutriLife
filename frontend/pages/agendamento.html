<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar consulta | NutriLife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="booking">
    <div class="dashboard-shell">
        <div data-component="app-sidebar" data-raiz="../" data-ativo="search-nav"></div>
        <main class="dashboard-main">
            <header class="dashboard-header">
                <div><span class="eyebrow">Agendamento</span><h1>Escolha um horário</h1><p id="booking-professional"></p></div>
                <div class="calendar-controls">
                    <button id="previous-month" class="btn btn--ghost" type="button" aria-label="Mês anterior">‹</button>
                    <strong id="calendar-month"></strong>
                    <button id="next-month" class="btn btn--ghost" type="button" aria-label="Próximo mês">›</button>
                </div>
            </header>
            <p id="dashboard-status" class="dashboard-status" role="alert" hidden></p>
            <section class="calendar-layout">
                <div class="panel">
                    <div class="calendar-weekdays"><span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span></div>
                    <div id="availability-calendar" class="availability-calendar" aria-live="polite"></div>
                </div>
                <div class="panel">
                    <h3 id="selected-date-title">Selecione um dia</h3>
                    <div id="available-slots" class="slot-list"></div>
                    <p class="item-meta">Quando houver link de pagamento, ele será exibido após a reserva. Sem link configurado, a consulta aguardará a confirmação da nutricionista.</p>
                </div>
            </section>
        </main>
    </div>
    <div data-component="footer" data-raiz="../"></div>

    <script src="../js/components.js" defer></script>
    <script src="../config.js" defer></script><script src="../js/api.js" defer></script><script src="../js/app.js" defer></script>
</body>
</html>

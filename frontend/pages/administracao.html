<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração | NutriLife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@0,400;0,500;0,600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="admin-users">
    <div class="dashboard-shell">
        <div data-component="app-sidebar" data-raiz="../" data-ativo="admin-users-nav"></div>
        <main class="dashboard-main">
            <header class="dashboard-header">
                <div>
                    <span class="eyebrow">Administração da plataforma</span>
                    <h1>Usuários</h1>
                    <p>Edite contas, altere perfis e gerencie o acesso à plataforma.</p>
                </div>
            </header>
            <p id="dashboard-status" class="dashboard-status" role="alert" hidden></p>
            <section class="panel admin-users-panel">
                <div class="admin-toolbar">
                    <div class="input-group admin-toolbar__search">
                        <label for="admin-user-search">Buscar por nome ou e-mail</label>
                        <input id="admin-user-search" type="search" autocomplete="off" placeholder="Ex.: Ana ou ana@email.com">
                    </div>
                    <div id="admin-user-filters" class="admin-filters" role="group" aria-label="Filtrar usuários"></div>
                </div>
                <p id="admin-users-count" class="item-meta"></p>
                <div id="admin-users-list" class="admin-users-list" aria-live="polite">
                    <p class="item-meta">Carregando usuários...</p>
                </div>
            </section>
        </main>
    </div>
    <div data-component="footer" data-raiz="../"></div>

    <script src="../js/components.js" defer></script>
    <script src="../config.js" defer></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/app.js" defer></script>
</body>
</html>

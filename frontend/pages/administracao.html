<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração | NutriLife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@0,400;0,500;0,600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="admin-users">
    <div class="dashboard-shell">
        <aside class="dashboard-sidebar">
            <a class="brand" href="../index.html">
                <img src="../assets/images/NutriLife-logo-semfundo.png" alt="NutriLife" class="brand-logo">
            </a>
            <nav class="sidebar-nav" aria-label="Navegação do painel">
                <a href="../dashboard.html" class="sidebar-link">Visão geral</a>
                <a href="./administracao.html" class="sidebar-link is-active" aria-current="page">Administrar usuários</a>
            </nav>
            <button id="logout-button" class="sidebar-logout" type="button">Sair</button>
        </aside>
        <main class="dashboard-main">
            <header class="dashboard-header">
                <div>
                    <span class="eyebrow">Administração da plataforma</span>
                    <h1>Usuários</h1>
                    <p>Edite contas, altere perfis e gerencie o acesso à plataforma.</p>
                </div>
            </header>
            <p id="dashboard-status" class="dashboard-status" role="alert" hidden></p>
            <section class="panel admin-users-panel">
                <div class="input-group">
                    <label for="admin-user-search">Buscar por nome ou e-mail</label>
                    <input id="admin-user-search" type="search" autocomplete="off">
                </div>
                <div id="admin-users-list" class="admin-users-list" aria-live="polite">
                    <p class="item-meta">Carregando usuários...</p>
                </div>
            </section>
        </main>
    </div>
    <script src="../config.js" defer></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/app.js" defer></script>
</body>
</html>

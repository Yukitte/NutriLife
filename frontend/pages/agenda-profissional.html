<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disponibilidade profissional | NutriLife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="professional-calendar">
    <div class="dashboard-shell">
        <div data-component="app-sidebar" data-raiz="../" data-ativo="availability-nav"></div>
        <main class="dashboard-main">
            <header class="dashboard-header">
                <div>
                    <span class="eyebrow">Agenda profissional</span>
                    <h1>Disponibilidade</h1>
                    <p>Configure seus horários da semana e clique em um dia do calendário para ajustar só aquela data.</p>
                </div>
            </header>
            <p id="dashboard-status" class="dashboard-status" role="alert" hidden></p>
            <section class="professional-availability-grid">
                <article class="panel availability-calendar-panel">
                    <header class="availability-calendar-header">
                        <h2>Agenda mensal</h2>
                        <div class="calendar-controls">
                            <button id="availability-previous-month" class="btn btn--ghost" type="button" aria-label="Mês anterior">‹</button>
                            <strong id="availability-calendar-month"></strong>
                            <button id="availability-next-month" class="btn btn--ghost" type="button" aria-label="Próximo mês">›</button>
                        </div>
                    </header>
                    <div class="calendar-weekdays" aria-hidden="true">
                        <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
                    </div>
                    <div id="professional-availability-calendar" class="availability-calendar" aria-label="Calendário mensal de atendimento"></div>
                    <div class="availability-legend">
                        <span><i class="availability-legend__swatch"></i> Horário da semana</span>
                        <span><i class="availability-legend__swatch availability-legend__swatch--custom"></i> Ajustado só para o dia</span>
                        <span><i class="availability-legend__swatch availability-legend__swatch--closed"></i> Sem atendimento no dia</span>
                    </div>
                </article>
                <article class="panel availability-editor-panel">
                    <h2 id="availability-selected-date">Horários do dia</h2>
                    <div id="availability-day-schedule" class="availability-day-schedule" aria-live="polite"></div>
                    <form id="availability-form" class="dashboard-form">
                        <h3>Editar disponibilidade semanal</h3>
                        <div class="input-group">
                            <label for="timezone">Fuso horário</label>
                            <select id="timezone" name="fuso_horario">
                                <option value="America/Sao_Paulo">Brasília (America/Sao_Paulo)</option>
                                <option value="America/Manaus">Manaus</option>
                                <option value="America/Rio_Branco">Rio Branco</option>
                                <option value="America/Noronha">Fernando de Noronha</option>
                            </select>
                        </div>
                        <div id="weekday-schedules" class="weekday-schedules"></div>
                        <button class="btn btn--primary" type="submit">Salvar disponibilidade</button>
                    </form>
                </article>
            </section>
        </main>
    </div>
    <div data-component="footer" data-raiz="../"></div>

    <script src="../js/components.js" defer></script>
    <script src="../config.js" defer></script><script src="../js/api.js" defer></script><script src="../js/app.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar perfil profissional | NutriLife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="professional-profile-edit">
    <div class="dashboard-shell">
        <div data-component="app-sidebar" data-raiz="../" data-ativo="profile-nav"></div>
        <main class="dashboard-main">
            <header class="dashboard-header"><div><span class="eyebrow">Perfil público</span><h1>Editar perfil profissional</h1></div></header>
            <p id="dashboard-status" class="dashboard-status" role="alert" hidden></p>
            <article class="panel">
                <form id="professional-profile-form" class="dashboard-form">
                    <div class="input-group"><label for="professional-phone">Telefone/WhatsApp</label><input id="professional-phone" name="telefone" type="tel" required></div>
                    <div class="input-group"><label for="professional-address">Endereço</label><input id="professional-address" name="endereco" required></div>
                    <div class="profile-fields">
                        <div class="input-group"><label for="professional-cep">CEP</label><input id="professional-cep" name="cep" required></div>
                        <div class="input-group"><label for="professional-state">Estado (UF)</label><input id="professional-state" name="estado" minlength="2" maxlength="2" required></div>
                    </div>
                    <div class="input-group"><label for="specialties">Especialidades (separadas por vírgula)</label><input id="specialties" name="especialidades"></div>
                    <div class="input-group"><label for="biography">Biografia profissional</label><textarea id="biography" name="biografia" maxlength="2000"></textarea></div>
                    <div class="input-group"><label for="consult-price">Valor da consulta</label><input id="consult-price" name="valor_consulta" type="number" min="0" step="0.01" required></div>
                    <div class="input-group"><label for="pagseguro-link">Link de checkout PagSeguro</label><input id="pagseguro-link" name="pagseguro_link" type="url" placeholder="https://"></div>
                    <p class="item-meta">O link PagSeguro será apresentado ao paciente quando reservar um horário; a confirmação do pagamento é manual.</p>
                    <button class="btn btn--primary" type="submit">Salvar perfil</button>
                </form>
            </article>

            <section class="pro-section pro-reviews">
                <div class="pro-reviews__head">
                    <h2>Comentários dos pacientes</h2>
                </div>
                <p class="item-meta">Responda os comentários que seus pacientes deixaram no seu perfil público.</p>
                <ul id="received-reviews" class="reviews" aria-live="polite">
                    <li class="item-meta">Carregando comentários...</li>
                </ul>
            </section>
        </main>
    </div>
    <div data-component="footer" data-raiz="../"></div>

    <script src="../js/components.js" defer></script>
    <script src="../config.js" defer></script><script src="../js/api.js" defer></script><script src="../js/app.js" defer></script>
</body>
</html>

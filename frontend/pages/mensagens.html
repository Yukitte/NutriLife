<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagens | NutriLife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-page="messages">
    <div class="dashboard-shell">
        <div data-component="app-sidebar" data-raiz="../" data-ativo="messages-nav"></div>

        <main class="dashboard-main messages-page">
            <header class="dashboard-header">
                <div>
                    <span class="eyebrow">Bate-papo</span>
                    <h1>Mensagens</h1>
                    <p id="messages-subtitle">Converse com quem acompanha a sua alimentação.</p>
                </div>
            </header>
            <p id="dashboard-status" class="dashboard-status" role="alert" hidden></p>

            <section id="chat" class="panel chat">
                <aside class="chat__list" aria-label="Conversas">
                    <h3>Conversas</h3>
                    <div id="chat-conversations" class="chat__conversations">
                        <p class="item-meta">Carregando conversas...</p>
                    </div>
                </aside>
                <section class="chat__thread" aria-live="polite">
                    <header class="chat__thread-head">
                        <button id="chat-back" class="btn btn--ghost chat__back" type="button" aria-label="Voltar para as conversas">‹</button>
                        <div>
                            <strong id="chat-contact-name">Selecione uma conversa</strong>
                            <span id="chat-contact-role" class="item-meta"></span>
                        </div>
                    </header>
                    <div id="chat-messages" class="chat__messages">
                        <p class="item-meta chat__empty">Escolha uma conversa ao lado para ver as mensagens.</p>
                    </div>
                    <form id="chat-form" class="chat__form" hidden>
                        <label for="chat-text" class="sr-only">Mensagem</label>
                        <textarea id="chat-text" rows="2" maxlength="2000" placeholder="Escreva uma mensagem..." title="Enter envia · Shift+Enter quebra a linha" required></textarea>
                        <button class="btn btn--primary" type="submit">Enviar</button>
                    </form>
                </section>
            </section>
        </main>
    </div>
    <div data-component="footer" data-raiz="../"></div>

    <script src="../js/components.js" defer></script>
    <script src="../config.js" defer></script>
    <script src="../js/api.js" defer></script>
    <script src="../js/app.js" defer></script>
</body>
</html>

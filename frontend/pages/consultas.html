<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamentos | NutriLife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-page="appointments">
    <div class="dashboard-shell">
        <div data-component="app-sidebar" data-raiz="../" data-ativo="appointments-nav"></div>

            </header>

            <section id="appointments-list" class="appointment-list" aria-live="polite"><p>Carregando consultas...</p></section>
        </main>
    </div>
    <div data-component="footer" data-raiz="../"></div>

    <script src="../js/components.js" defer></script>
    <script src="../config.js" defer></script><script src="../js/api.js" defer></script><script src="../js/app.js" defer></script>

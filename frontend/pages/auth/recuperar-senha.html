<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha | NutriLife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body data-page="password-reset">
    <main class="auth-page">
        <section class="auth-panel auth-panel--standalone">
            <a class="auth-brand" href="../../index.html" aria-label="NutriLife - página inicial">
                <img src="../../assets/images/NutriLife-logo-semfundo.png" alt="NutriLife">
            </a>
            <a href="./login.html" class="btn btn--ghost">Voltar para login</a>
            <span class="eyebrow">Recuperação de acesso</span>
            <h1>Redefinir senha</h1>
            <p>Informe seu e-mail e escolha uma nova senha. O link será enviado ao e-mail cadastrado.</p>
            <form id="password-reset-form" class="auth-form is-active">
                <div id="reset-email-group" class="input-group">
                    <label for="reset-email">E-mail</label>
                    <input id="reset-email" name="email" type="email" autocomplete="email" required>
                </div>
                <div id="reset-password-fields" class="dashboard-form" hidden>
                    <div class="input-group">
                        <label for="reset-password">Nova senha</label>
                        <input id="reset-password" name="senha" type="password" minlength="8" maxlength="128">
                    </div>
                    <div class="input-group">
                        <label for="reset-confirm-password">Confirmar nova senha</label>
                        <input id="reset-confirm-password" name="confirmacao" type="password" minlength="8" maxlength="128">
                    </div>
                </div>
                <button class="btn btn--primary" type="submit">Confirmar</button>
                <p id="reset-status" class="auth-status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <script src="../../config.js" defer></script><script src="../../js/api.js" defer></script><script src="../../js/app.js" defer></script>
</body>
</html>

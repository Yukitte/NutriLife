<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha | NutriLife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
</head>
<body data-page="password-reset">
    <main class="auth-page">
        <section class="auth-panel auth-panel--standalone">
            <div class="auth-panel__top">
                <a class="auth-brand" href="../../index.html" aria-label="NutriLife - página inicial">
                    <img src="../../assets/images/NutriLife-logo-semfundo.png" alt="NutriLife">
                </a>
                <a href="./login.html" class="btn btn--ghost auth-back">← Voltar para login</a>
            </div>
            <span class="eyebrow">Recuperação de acesso</span>
            <h1>Redefinir senha</h1>
            <p class="auth-panel__intro">Informe o CPF e o e-mail usados no cadastro e escolha uma nova senha.</p>
            <form id="password-reset-form" class="auth-form is-active">
                <div class="input-group">
                    <label for="reset-cpf">CPF</label>
                    <input id="reset-cpf" name="cpf" inputmode="numeric" placeholder="000.000.000-00" minlength="14" maxlength="14" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Informe o CPF, ex.: 000.000.000-00" required>
                </div>
                <div class="input-group">
                    <label for="reset-email">E-mail</label>
                    <input id="reset-email" name="email" type="email" placeholder="seu@email.com" autocomplete="email" required>
                </div>
                <div class="input-group">
                    <label for="reset-password">Nova senha</label>
                    <input id="reset-password" name="senha" type="password" placeholder="Mínimo de 8 caracteres" autocomplete="new-password" minlength="8" maxlength="128" required>
                </div>
                <div class="input-group">
                    <label for="reset-confirm-password">Confirmar nova senha</label>
                    <input id="reset-confirm-password" name="confirmacao" type="password" placeholder="Repita a nova senha" autocomplete="new-password" minlength="8" maxlength="128" required>
                </div>
                <button class="btn btn--primary" type="submit">Redefinir senha</button>
                <p id="reset-status" class="auth-status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <script src="../../config.js" defer></script><script src="../../js/api.js" defer></script><script src="../../js/app.js" defer></script>
</body>
</html>

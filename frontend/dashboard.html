<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | NutriLife</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body data-page="dashboard">
    <div class="dashboard-shell">
        <aside class="dashboard-sidebar">
            <div class="brand">
                <a href="./index.html">
                    <img src="./assets/images/NutriLife-logo-semfundo.png" alt="NutriLife" class="brand-logo">
                </a>
            </div>

            <nav class="sidebar-nav" aria-label="Navegação do painel">
                <a href="#resumo" class="sidebar-link is-active">Visão geral</a>
                <a href="#planos" class="sidebar-link">Planos alimentares</a>
                <a href="#patients-panel" class="sidebar-link">Pacientes</a>
            </nav>

            <button id="logout-button" class="sidebar-logout" type="button">Sair</button>
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-header">
                <div>
                    <span class="eyebrow">Painel da plataforma</span>
                    <h1>Olá, <span id="user-name">Usuário</span></h1>
                </div>
                <span class="btn btn--primary" id="user-role">Paciente</span>
            </header>

            <p id="dashboard-status" class="dashboard-status" role="alert" hidden></p>

            <section id="resumo" class="dashboard-kpis" aria-label="Resumo do painel">
                <article class="kpi-card">
                    <span class="kpi-card__label">Planos alimentares</span>
                    <div id="plans-count" class="kpi-card__value">—</div>
                </article>
            </section>

            <section class="dashboard-grid">
                <article id="planos" class="panel">
                    <h3>Planos alimentares</h3>
                    <div id="plans-list" class="plans-list" aria-live="polite">
                        <p class="item-meta">Carregando planos...</p>
                    </div>
                </article>

                <article id="create-plan-panel" class="panel" hidden>
                    <h3>Criar plano alimentar</h3>
                    <form id="create-plan-form" class="dashboard-form">
                        <div class="input-group">
                            <label for="plan-patient">Paciente</label>
                            <select id="plan-patient" name="paciente_id" required>
                                <option value="">Carregando pacientes...</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="plan-title">Título</label>
                            <input id="plan-title" name="titulo" minlength="3" maxlength="120" required>
                        </div>
                        <div class="input-group">
                            <label for="plan-description">Orientações</label>
                            <textarea id="plan-description" name="descricao" maxlength="1000" required></textarea>
                        </div>
                        <div class="input-group">
                            <label for="plan-meals">Refeições (uma por linha)</label>
                            <textarea id="plan-meals" name="refeicoes" required></textarea>
                        </div>
                        <button type="submit" class="btn btn--primary">Salvar plano</button>
                    </form>
                </article>

                <article id="patients-panel" class="panel" hidden>
                    <h3>Pacientes cadastrados</h3>
                    <ul id="patients-list" class="list"></ul>
                </article>
            </section>
        </main>
    </div>

    <script src="./config.js" defer></script>
    <script src="./js/api.js" defer></script>
    <script src="./js/app.js" defer></script>
</body>
</html>

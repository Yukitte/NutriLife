<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | NutriLife</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/auth/auth.css">
</head>

<body class="auth-page">

    <div data-component="auth-brand"></div>

    <main class="auth-main">
        <section class="auth-card">
            <span class="eyebrow">Bem-vindo de volta</span>
            <h1>Entrar</h1>
            <p class="auth-card__subtitle">
                Acesse sua conta para acompanhar seu cuidado nutricional.
            </p>

            <form id="login-form" class="auth-form">
                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="voce@email.com" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Sua senha" autocomplete="current-password" required>
                    <a href="/pages/auth/redefinir-senha.html" class="field-forgot">Esqueci minha senha</a>
                </div>

                <p class="auth-feedback" role="status" aria-live="polite"></p>

                <button type="submit" class="btn btn--primary auth-submit">Entrar</button>
            </form>

            <p class="auth-switch">
                Ainda não tem conta?
                <a href="/pages/auth/cadastro.html">Criar conta</a>
            </p>
        </section>
    </main>

    <script src="/js/components.js" defer></script>
    <script src="/js/auth/login.js" defer></script>
</body>

</html>

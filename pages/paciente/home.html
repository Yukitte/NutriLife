<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Home | NutriLife</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/paciente/layout.css">
    <link rel="stylesheet" href="/css/paciente/home.css">
</head>

<body class="app-page">

    <div data-component="header-paciente"></div>

    <main class="app-main">
        <section class="greeting">
            <div class="greeting__text">
                <span class="eyebrow" id="data-hoje"></span>
                <h1>Olá, <span id="nome-paciente"></span></h1>
                <p>
                    Você ainda não tem um nutricionista. Encontre um
                    profissional perto de você e comece seu acompanhamento.
                </p>
            </div>
            <span class="greeting__avatar" id="avatar-paciente" aria-hidden="true"></span>
        </section>

        <section class="nutri-search" aria-labelledby="titulo-nutricionistas">
            <div class="nutri-search__head">
                <h2 id="titulo-nutricionistas">Nutricionistas perto de você</h2>
                <p class="nutri-count" id="nutri-count" aria-live="polite"></p>
            </div>

            <div class="nutri-filters">
                <div class="distance-filter" role="group" aria-label="Filtrar por distância">
                    <span class="filter-label">Distância</span>
                    <button type="button" class="chip chip--active" data-distancia="" aria-pressed="true">Todas</button>
                    <button type="button" class="chip" data-distancia="2" aria-pressed="false">Até 2 km</button>
                    <button type="button" class="chip" data-distancia="5" aria-pressed="false">Até 5 km</button>
                    <button type="button" class="chip" data-distancia="10" aria-pressed="false">Até 10 km</button>
                </div>

                <div class="specialty-filter">
                    <label for="filtro-especialidade" class="filter-label">Especialidade</label>
                    <select id="filtro-especialidade">
                        <option value="">Todas</option>
                    </select>
                </div>
            </div>

            <ul class="nutri-grid" id="nutri-list"></ul>

            <p class="nutri-empty" id="nutri-empty" hidden>
                Nenhum nutricionista encontrado com esses filtros. Tente aumentar a distância ou escolher outra especialidade.
            </p>
        </section>
    </main>

    <a class="whatsapp-fab" id="whatsapp-suporte" target="_blank" rel="noopener" aria-label="Falar com o suporte pelo WhatsApp" hidden></a>

    <div data-component="footer-app"></div>

    <script src="/js/components.js" defer></script>
    <script src="/js/especialidades.js" defer></script>
    <script src="/js/paciente/layout.js" defer></script>
    <script src="/js/paciente/nutricionistas.mock.js" defer></script>
    <script src="/js/paciente/home.js" defer></script>
</body>

</html>
